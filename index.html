
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 포켓몬 찾기</title>
<style>
:root {
  --cream: #fff9e9;
  --paper: #fffdf7;
  --yellow: #ffd94a;
  --ink: #302b24;
  --muted: #756d60;
  --green: #326b57;
  --line: #eadfc8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: system-ui, sans-serif;
}
header {
  padding: 42px 20px 28px;
  text-align: center;
  background: linear-gradient(#fff1a9, var(--cream));
}
.kicker {
  display: inline-block;
  background: white;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13px;
  font-weight: 800;
}
h1 {
  font-size: clamp(30px, 6vw, 48px);
  margin: 14px 0 8px;
  letter-spacing: -.06em;
}
header p { color: var(--muted); }
main {
  width: min(920px, calc(100% - 28px));
  margin: 0 auto 50px;
}
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: clamp(18px, 4vw, 30px);
  box-shadow: 0 8px 0 #f0e4c9;
  margin: 18px 0;
}
h2 { font-size: 21px; margin: 0 0 8px; }
.sub {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 20px;
}
.types {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.type {
  border: 1px solid var(--line);
  background: white;
  border-radius: 13px;
  padding: 13px 6px;
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  cursor: pointer;
}
.type:hover { border-color: #d2b23b; }
.type[aria-pressed="true"] {
  background: var(--yellow);
  border-color: #d8ad16;
  box-shadow: 0 3px 0 #d8ad16;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}
.primary, .secondary {
  border: 0;
  border-radius: 13px;
  padding: 13px 18px;
  font-weight: 800;
  cursor: pointer;
}
.primary { background: var(--green); color: white; flex: 1; }
.secondary { background: #f3ead8; color: var(--ink); }
.result { display: none; }
.result.show { display: block; animation: appear .3s ease; }
@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.result-top {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 22px;
  align-items: center;
  margin-top: 16px;
}
.monster {
  height: 150px;
  border-radius: 22px;
  background: linear-gradient(135deg, #fff0a5, #ffe6e2);
  display: grid;
  place-items: center;
  font-size: 82px;
  border: 1px solid #f0dfb5;
}
.tag {
  display: inline-block;
  background: #e3f1e8;
  color: #285942;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 900;
}
.result h3 { font-size: 30px; margin: 9px 0 5px; }
.type-label { color: var(--muted); font-size: 14px; }
.reason { line-height: 1.8; }
.compat {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 22px;
}
.compat-card {
  background: #fff8e8;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
}
.compat-card small { color: var(--muted); font-weight: 800; }
.compat-card strong { display: block; font-size: 18px; margin: 7px 0; }
.compat-card p { font-size: 14px; line-height: 1.65; }
.note, footer { color: var(--muted); font-size: 12px; line-height: 1.7; }
footer { text-align: center; padding: 0 15px 28px; }
@media (max-width: 560px) {
  .types { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .result-top { grid-template-columns: 1fr; text-align: center; }
  .monster { height: 135px; font-size: 74px; }
  .compat { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <span class="kicker">PERSONALITY × POKÉMON</span>
  <h1>나와 닮은 포켓몬은?</h1>
  <p>MBTI를 선택하고 나와 어울리는 포켓몬을 찾아봐!</p>
</header>

<main>
  <section class="panel">
    <h2>🧩 나의 MBTI 고르기</h2>
    <p class="sub">16가지 유형 중 하나를 선택해 줘!</p>
    <div class="types" id="types"></div>
    <div class="actions">
      <button class="primary" id="showBtn">이 MBTI의 포켓몬 찾기 ✨</button>
      <button class="secondary" id="resetBtn">다시 고르기</button>
    </div>
  </section>

  <section class="panel result" id="result" aria-live="polite">
    <span class="tag">YOUR POKÉMON PARTNER</span>
    <div class="result-top">
      <div class="monster" id="emoji">⚡</div>
      <div>
        <div class="type-label" id="selectedType"></div>
        <h3 id="pokemonName"></h3>
        <div class="type-label" id="pokemonType"></div>
        <p class="reason" id="reason"></p>
      </div>
    </div>
    <div class="compat">
      <div class="compat-card">
        <small>🤝 잘 맞을 수 있는 유형</small>
        <strong id="goodType"></strong>
        <p id="goodText"></p>
      </div>
      <div class="compat-card">
        <small>🌱 색다른 관점을 주는 유형</small>
        <strong id="otherType"></strong>
        <p id="otherText"></p>
      </div>
    </div>
    <p class="note">
      ※ 포켓몬 매칭과 MBTI 궁합은 재미를 위한 콘텐츠이며
      과학적 판정이나 공식 궁합이 아닙니다.
    </p>
  </section>
</main>

<footer>작은 취향 테스트 · 결과는 가볍게 즐겨 주세요 💛</footer>

<script>
const data = {
  ISTJ: ["꼬부기","🐢","물 타입 · 성실한 실천가",
    "계획을 세우고 맡은 일을 꾸준히 해내는 모습이 꼬부기와 닮았어요.",
    "ESFP","ENFP"],
  ISFJ: ["이브이","🦊","노말 타입 · 다정한 조력자",
    "주변을 세심하게 살피고 소중한 사람을 챙기는 다정함이 이브이와 어울려요.",
    "ESFP","ENTP"],
  INFJ: ["가디안","✨","에스퍼 타입 · 이상주의자",
    "사람의 마음을 이해하고 자신의 가치와 이상을 소중히 여기는 모습이 닮았어요.",
    "ENFP","ESTP"],
  INTJ: ["뮤츠","🧠","에스퍼 타입 · 전략가",
    "큰 그림을 생각하고 복잡한 문제의 원리를 파악하는 모습이 뮤츠와 어울려요.",
    "ENTP","ESFP"],
  ISTP: ["루카리오","🥋","격투 타입 · 해결사",
    "직접 관찰하고 원리를 익힌 뒤 실력을 발휘하는 점이 루카리오와 닮았어요.",
    "ESTJ","ENFJ"],
  ISFP: ["님피아","🎀","페어리 타입 · 예술가",
    "자신의 취향과 감정을 소중히 여기며 부드럽게 어울리는 모습이 닮았어요.",
    "ESFJ","ENTJ"],
  INFP: ["쉐이미","🌼","풀 타입 · 몽상가",
    "상상력이 풍부하고 자신이 중요하게 여기는 가치를 지키는 모습이 어울려요.",
    "ENFJ","ESTJ"],
  INTP: ["메타몽","🟣","노말 타입 · 분석가",
    "여러 가능성을 실험하고 원리를 탐구하는 모습이 메타몽과 닮았어요.",
    "ENTJ","ESFJ"],
  ESTP: ["리자몽","🔥","불꽃·비행 타입 · 도전자",
    "생생한 경험을 즐기고 기회가 오면 과감하게 움직이는 에너지가 닮았어요.",
    "ISFJ","INFJ"],
  ESFP: ["피카츄","⚡","전기 타입 · 분위기 메이커",
    "사람들과 함께하는 순간을 즐기고 밝은 에너지를 전하는 모습이 어울려요.",
    "ISTJ","INTJ"],
  ENFP: ["푸린","🎤","노말·페어리 타입 · 아이디어 뱅크",
    "새로운 가능성을 발견하고 사람들을 즐겁게 하는 모습이 푸린과 닮았어요.",
    "INFJ","ISTJ"],
  ENTP: ["팬텀","👻","고스트·독 타입 · 발명가",
    "남들과 다르게 생각하고 기발한 아이디어를 내는 모습이 팬텀과 어울려요.",
    "INTJ","ISFJ"],
  ESTJ: ["윈디","🐕","불꽃 타입 · 리더",
    "목표를 분명히 하고 책임감 있게 팀을 이끄는 모습이 윈디와 닮았어요.",
    "ISTP","INFP"],
  ESFJ: ["해피너스","💗","노말 타입 · 돌봄이",
    "사람들을 챙기고 모두가 편안하도록 돕는 모습이 해피너스와 잘 맞아요.",
    "ISFP","INTP"],
  ENFJ: ["루카리오","💙","격투·강철 타입 · 리더",
    "사람들의 가능성을 발견하고 함께 성장하도록 이끄는 모습이 닮았어요.",
    "INFP","ISTP"],
  ENTJ: ["보만다","🐉","드래곤·비행 타입 · 전략가",
    "높은 목표를 세우고 큰 그림을 향해 나아가는 모습이 보만다와 닮았어요.",
    "INTP","ISFP"]
};

const order = [
  "ISTJ","ISFJ","INFJ","INTJ",
  "ISTP","ISFP","INFP","INTP",
  "ESTP","ESFP","ENFP","ENTP",
  "ESTJ","ESFJ","ENFJ","ENTJ"
];

let selected = "ENFP";
const typesEl = document.getElementById("types");

order.forEach(type => {
  const button = document.createElement("button");
  button.className = "type";
  button.type = "button";
  button.textContent = type;
  button.setAttribute("aria-pressed", "false");
  button.addEventListener("click", () => choose(type));
  typesEl.appendChild(button);
});

function choose(type) {
  selected = type;
  document.querySelectorAll(".type").forEach(button => {
    button.setAttribute("aria-pressed",
      String(button.textContent === type));
  });
}

function showResult() {
  const d = data[selected];
  document.getElementById("selectedType").textContent =
    selected + " 유형";
  document.getElementById("emoji").textContent = d[1];
  document.getElementById("pokemonName").textContent = d[0];
  document.getElementById("pokemonType").textContent = d[2];
  document.getElementById("reason").textContent = d[3];
  document.getElementById("goodType").textContent = d[4];
  document.getElementById("goodText").textContent =
    d[4] + " 유형은 서로의 장점을 보완하며 새로운 시각을 줄 수 있어요.";
  document.getElementById("otherType").textContent = d[5];
  document.getElementById("otherText").textContent =
    d[5] + " 유형과는 생각하는 방식이 다를 수 있지만, 그 차이에서 배울 점을 찾을 수 있어요.";

  document.getElementById("result").classList.add("show");
  document.getElementById("result").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

document.getElementById("showBtn").addEventListener("click", showResult);

document.getElementById("resetBtn").addEventListener("click", () => {
  selected = "ENFP";
  document.querySelectorAll(".type").forEach(button => {
    button.setAttribute("aria-pressed", "false");
  });
  document.getElementById("result").classList.remove("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
});

choose(selected);
</script>
</body>
</html>
